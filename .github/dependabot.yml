version: 2
updates:
  # npm runtime + dev dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # plugin-react 6.x requires vite ^8, but electron-vite 5 only supports
      # vite ^5-7. Hold at 4.x until the toolchain can move to vite 8.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep React + typing PRs bundled to reduce noise.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Keep electron + electron-builder + electron-vite bundled — they
      # interlock and breaking one often needs another bumped too.
      electron-stack:
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-vite"
          - "@electron/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"

  # GitHub Actions used in workflows — keeps the SHA pins fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
